    <style>
        /* Thẻ kính chứa toàn bộ nội dung */
        .glass-panel {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            /* Bỏ backdrop-filter ở đây để màu nền bên trong hiển thị rõ nhất */
        }

        /* NỀN VÀNG WATERCOLOR Y HỆT ẢNH MẪU BÊN TRONG THẺ */
        .watercolor-bg {
            background: #fffdf2; 
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        /* Thêm độ nhám (texture) của giấy vẽ màu nước */
        .watercolor-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url('https://www.transparenttextures.com/patterns/watercolor.png');
            opacity: 0.4;
            mix-blend-mode: multiply;
        }

        /* Các vệt loang màu vàng đậm nhạt (như vệt cọ vẽ) */
        .watercolor-blob-1 {
            position: absolute;
            top: -5%; left: -20%;
            width: 100%; height: 60%;
            background: radial-gradient(ellipse, #ffe57f 0%, transparent 60%);
            opacity: 0.7;
            filter: blur(40px);
        }
        
        .watercolor-blob-2 {
            position: absolute;
            bottom: -10%; right: -20%;
            width: 120%; height: 60%;
            background: radial-gradient(ellipse, #ffd54f 0%, transparent 60%);
            opacity: 0.5;
            filter: blur(50px);
        }

        /* Lớp kính mờ cho các thành phần con để chữ dễ đọc trên nền vàng */
        .glass-content-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .glass-card {
            background: rgb(60 214 239 / 47%); /* Màu xanh cyan cho trang chủ */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Thẻ sản phẩm trong trang danh mục dùng màu hồng */
        #category-view .glass-card {
            background: rgb(236 178 185 / 82%);
        }

        /* Hover Glow Effect cho thẻ sản phẩm */
        .glass-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 15px 35px rgba(255, 154, 158, 0.5), 0 0 20px rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 1);
            border-color: #FF9A9E;
        }

        .avatar-float { animation: float 3s ease-in-out infinite; }
        @keyframes float { 
            0% { transform: translateY(0px) rotate(0deg); } 
            50% { transform: translateY(-12px) rotate(3deg); } 
            100% { transform: translateY(0px) rotate(0deg); } 
        }

        .fade-up {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .fade-up.visible { opacity: 1; transform: translateY(0); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 154, 158, 0.8); border-radius: 10px; }

        /* ================= HIỆU ỨNG TÂN TIẾN ================= */

        /* 1. Tuyết phát sáng nhấp nháy */
        .bling-star {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: twinkle fall linear infinite;
            z-index: 1;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); box-shadow: 0 0 0 white; }
            50% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 15px rgba(255,255,255,1), 0 0 30px rgba(255, 200, 220, 0.8); }
        }
        @keyframes fall {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        /* 2. Lá Sakura rơi xoay tròn */
        .sakura-petal {
            position: absolute;
            background: linear-gradient(135deg, #ffc0cb, #ffb6c1);
            border-radius: 15px 0px 15px 0px; /* Hình cánh hoa */
            pointer-events: none;
            animation: fall-sakura linear infinite, sway ease-in-out infinite alternate;
            z-index: 0;
            opacity: 0.8;
            box-shadow: 0 2px 5px rgba(255, 182, 193, 0.5);
        }
        
        @keyframes fall-sakura {
            0% { top: -10%; transform: rotate(0deg); }
            100% { top: 110%; transform: rotate(360deg); }
        }
        
        @keyframes sway {
            0% { margin-left: 0px; }
            100% { margin-left: 50px; }
        }
    </style>
</head>

    <script>
        // Link Google Sheet của bạn
        const GOOGLE_SHEET_TSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTeaTZaKLHjxkgO8lvKmtT64EBlErX9mf8l5xipn9anrxtLZUib2WFJD6fX5HrTzCBEqDrkVj0Al1xz/pub?output=tsv"; 
        const GOOGLE_SHEET_GROUPS_TSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTeaTZaKLHjxkgO8lvKmtT64EBlErX9mf8l5xipn9anrxtLZUib2WFJD6fX5HrTzCBEqDrkVj0Al1xz/pub?gid=385251534&single=true&output=tsv"; 

        // Data dự phòng khi chạy thử trực tiếp (hoặc khi mất kết nối mạng)
        let products = [
            { Ten: "Bìa còng trong suốt (Mẫu)", MoTa: "Nhấn để mua qua Shopee nha", LinkAnh: "https://down-vn.img.susercontent.com/file/vn-11134207-7ra0g-m9zfor20733i9f.webp", LinkShopee: "https://s.shopee.vn/3B4jLTuLLS" },
            { Ten: "Túi refill CeraVe (Mẫu)", MoTa: "Nhấn để mua qua Shopee nha", LinkAnh: "https://down-vn.img.susercontent.com/file/sg-11134201-825an-mr00u8btxb7l04.webp", LinkShopee: "https://s.shopee.vn/6VMWf0FqWB" }
        ];
        let groupProducts = [
            { Ten: "Bìa còng trong suốt (Mẫu)", DanhMuc: "Gia dụng", MoTa: "Nhấn để mua qua Shopee nha", LinkAnh: "https://down-vn.img.susercontent.com/file/vn-11134207-7ra0g-m9zfor20733i9f.webp", LinkShopee: "https://s.shopee.vn/3B4jLTuLLS" },
            { Ten: "Túi refill CeraVe (Mẫu)", DanhMuc: "Chăm sóc cá nhân", MoTa: "Nhấn để mua qua Shopee nha", LinkAnh: "https://down-vn.img.susercontent.com/file/sg-11134201-825an-mr00u8btxb7l04.webp", LinkShopee: "https://s.shopee.vn/6VMWf0FqWB" }
        ];

        function parseTSV(tsv) {
            // Loại bỏ ký tự \r để tránh lỗi trên một số hệ điều hành
            const cleanTsv = tsv.replace(/\r/g, '');
            const lines = cleanTsv.split('\n');
            const headers = lines[0].split('\t').map(h => h.trim());
            const result = [];
            for(let i=1; i<lines.length; i++) {
                if(!lines[i].trim()) continue;
                const currentline = lines[i].split('\t');
                const obj = {};
                for(let j=0; j<headers.length; j++) {
                    obj[headers[j]] = currentline[j] ? currentline[j].trim() : "";
                }
                result.push(obj);
            }
            return result;
        }

        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = ''; 
            
            // Bộ màu siêu ngọt ngào cho badge số
            const badgeColors = [
                'bg-pink-400 text-white shadow-[0_0_10px_rgba(244,114,182,0.6)]', 
                'bg-purple-400 text-white shadow-[0_0_10px_rgba(192,132,252,0.6)]', 
                'bg-rose-400 text-white shadow-[0_0_10px_rgba(251,113,133,0.6)]', 
                'bg-fuchsia-400 text-white shadow-[0_0_10px_rgba(232,121,249,0.6)]'
            ];

            items.forEach((item, index) => {
                if(!item.Ten) return; 
                const colorClass = badgeColors[index % badgeColors.length];
                
                const cardHTML = `
                    <a href="${item.LinkShopee}" target="_blank" class="glass-card rounded-[1.25rem] p-3 relative flex flex-col items-center text-center fade-up group overflow-visible">
                        
                        <!-- Huy hiệu số cực nổi -->
                        <div class="absolute -top-3 -left-3 w-9 h-9 ${colorClass} rounded-full flex items-center justify-center font-black text-[15px] border-2 border-white z-20 group-hover:scale-110 transition-transform">
                            ${index + 1}
                        </div>

                        <!-- Vùng chứa ảnh -->
                        <div class="w-full aspect-square rounded-[1rem] overflow-hidden mb-3 border-[3px] border-white/60 shadow-sm bg-white flex items-center justify-center relative">
                            <img src="${item.LinkAnh}" alt="${item.Ten}" onerror="this.src='https://placehold.co/400x400/ffe4e1/ff69b4?text=Xinh+quá'" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                            
                            <!-- Overlay CTA khi hover -->
                            <div class="absolute inset-0 bg-pink-500/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                                <i class="fas fa-shopping-bag text-white text-3xl drop-shadow-md"></i>
                            </div>
                        </div>

                        <!-- Text nội dung -->
                        <h3 class="font-black text-[13px] text-gray-800 leading-tight mb-1 group-hover:text-pink-600 transition-colors">${item.Ten}</h3>
                        <p class="text-[11px] text-gray-500 font-bold mb-3">${item.MoTa}</p>
                        
                        <!-- Nút Chốt Đơn mượt mà -->
                        <div class="mt-auto bg-gradient-to-r from-pink-400 to-rose-400 text-white text-[10px] tracking-wide uppercase font-black py-2 px-4 rounded-full w-full shadow-md group-hover:shadow-[0_4px_15px_rgba(244,114,182,0.5)] transform group-hover:-translate-y-0.5 transition-all duration-300">
                            ✨ Mua Ngay
                        </div>
                    </a>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });

            setTimeout(() => { document.querySelectorAll('#home-view .fade-up').forEach(el => el.classList.add('visible')); }, 100);
        }

        // Bộ màu gradient hồng pastel đồng bộ
        const categoryGradients = [
            'from-[#F5A0B8] to-[#F48FB1]',
            'from-[#F48FB1] to-[#EC407A]',
            'from-[#F8BBD0] to-[#F06292]',
            'from-[#FCE4EC] via-[#F48FB1] to-[#EC407A]',
            'from-[#F5A0B8] to-[#E91E63]',
            'from-[#F8BBD0] to-[#F48FB1]'
        ];

        function renderCategories(items) {
            const grid = document.getElementById('category-grid');
            grid.innerHTML = '';
            
            // Nhóm sản phẩm theo danh mục và lấy ảnh đầu tiên làm đại diện
            const categoriesMap = {};
            items.forEach(item => {
                if (!item.DanhMuc) return;
                const cat = item.DanhMuc.trim();
                if (!categoriesMap[cat]) {
                    categoriesMap[cat] = {
                        name: cat,
                        count: 0,
                        images: []
                    };
                }
                categoriesMap[cat].count++;
                if (item.LinkAnh && categoriesMap[cat].images.length < 3) {
                    categoriesMap[cat].images.push(item.LinkAnh);
                }
            });
            
            const categories = Object.values(categoriesMap);
            
            if (categories.length === 0) {
                grid.innerHTML = `
                    <div class="text-center py-6 text-gray-500 text-xs font-bold glass-card rounded-[1.25rem] p-4">
                        Chưa có danh mục nào được hiển thị 🌸
                    </div>
                `;
                return;
            }
            
            categories.forEach((cat, index) => {
                const gradient = categoryGradients[index % categoryGradients.length];
                const mainImg = cat.images[0] || 'https://placehold.co/400x400/ffe4e1/ff69b4?text=' + encodeURIComponent(cat.name);
                
                // Tạo mini thumbnails preview (tối đa 3 ảnh nhỏ xếp chồng)
                let thumbsHTML = '';
                cat.images.slice(0, 3).forEach((img, i) => {
                    thumbsHTML += `<img src="${img}" class="w-7 h-7 rounded-full border-2 border-white object-cover shadow-sm ${i > 0 ? '-ml-2' : ''}" onerror="this.style.display='none'">`;
                });
                
                const cardHTML = `
                    <div onclick="showCategoryView('${cat.name.replace(/'/g, "\\'")}')" class="glass-card rounded-[1.25rem] relative flex items-stretch cursor-pointer group overflow-hidden fade-up min-h-[110px]">
                        
                        <!-- Ảnh bên trái -->
                        <div class="w-[110px] min-w-[110px] relative overflow-hidden">
                            <img src="${mainImg}" alt="${cat.name}" onerror="this.src='https://placehold.co/400x400/ffe4e1/ff69b4?text=${encodeURIComponent(cat.name)}'" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                            <!-- Gradient overlay -->
                            <div class="absolute inset-0 bg-gradient-to-r ${gradient} opacity-20 group-hover:opacity-30 transition-opacity"></div>
                        </div>
                        
                        <!-- Nội dung bên phải -->
                        <div class="flex-1 p-3.5 flex flex-col justify-center">
                            <h3 class="font-black text-[15px] text-gray-800 leading-tight group-hover:text-[#EC407A] transition-colors mb-1.5">${cat.name}</h3>
                            <p class="text-[11px] text-gray-500 font-bold mb-2.5">${cat.count} sản phẩm gợi ý</p>
                            
                            <div class="flex items-center justify-between">
                                <!-- Mini thumbnail preview -->
                                <div class="flex items-center">
                                    ${thumbsHTML}
                                </div>
                                
                                <!-- Nút Xem -->
                                <div class="bg-gradient-to-r from-[#F5A0B8] to-[#EC407A] text-white text-[11px] font-black px-5 py-2 rounded-full flex items-center gap-1.5 group-hover:shadow-[0_4px_15px_rgba(236,64,122,0.4)] group-hover:scale-105 transition-all duration-300">
                                    Xem ngay <i class="fas fa-arrow-right text-[8px]"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });
            
            setTimeout(() => { document.querySelectorAll('#categories-section .fade-up').forEach(el => el.classList.add('visible')); }, 150);
        }

        function showCategoryView(categoryName) {
            const homeView = document.getElementById('home-view');
            const categoryView = document.getElementById('category-view');
            
            homeView.classList.add('hidden');
            categoryView.classList.remove('hidden');
            
            document.getElementById('category-title').innerText = categoryName;
            
            const grid = document.getElementById('category-product-grid');
            grid.innerHTML = '';
            
            const filteredProducts = groupProducts.filter(item => item.DanhMuc && item.DanhMuc.trim() === categoryName);
            
            const badgeColors = [
                'bg-pink-400 text-white shadow-[0_0_10px_rgba(244,114,182,0.6)]', 
                'bg-purple-400 text-white shadow-[0_0_10px_rgba(192,132,252,0.6)]', 
                'bg-rose-400 text-white shadow-[0_0_10px_rgba(251,113,133,0.6)]', 
                'bg-fuchsia-400 text-white shadow-[0_0_10px_rgba(232,121,249,0.6)]'
            ];

            filteredProducts.forEach((item, index) => {
                if(!item.Ten) return; 
                const colorClass = badgeColors[index % badgeColors.length];
                
                const cardHTML = `
                    <a href="${item.LinkShopee}" target="_blank" class="glass-card rounded-[1.25rem] p-3 relative flex flex-col items-center text-center fade-up group overflow-visible">
                        <!-- Huy hiệu số cực nổi -->
                        <div class="absolute -top-3 -left-3 w-9 h-9 ${colorClass} rounded-full flex items-center justify-center font-black text-[15px] border-2 border-white z-20 group-hover:scale-110 transition-transform">
                            ${index + 1}
                        </div>

                        <!-- Vùng chứa ảnh -->
                        <div class="w-full aspect-square rounded-[1rem] overflow-hidden mb-3 border-[3px] border-white/60 shadow-sm bg-white flex items-center justify-center relative">
                            <img src="${item.LinkAnh}" alt="${item.Ten}" onerror="this.src='https://placehold.co/400x400/ffe4e1/ff69b4?text=Xinh+quá'" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                            
                            <!-- Overlay CTA khi hover -->
                            <div class="absolute inset-0 bg-pink-500/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                                <i class="fas fa-shopping-bag text-white text-3xl drop-shadow-md"></i>
                            </div>
                        </div>

                        <!-- Text nội dung -->
                        <h3 class="font-black text-[13px] text-gray-800 leading-tight mb-1 group-hover:text-pink-600 transition-colors">${item.Ten}</h3>
                        <p class="text-[11px] text-gray-500 font-bold mb-3">${item.MoTa}</p>
                        
                        <!-- Nút Chốt Đơn mượt mà -->
                        <div class="mt-auto bg-gradient-to-r from-[#FFE600] to-[#FFB800] text-gray-900 text-[10px] tracking-wide uppercase font-black py-2 px-4 rounded-full w-full shadow-md group-hover:shadow-[0_4px_15px_rgba(255,184,0,0.5)] transform group-hover:-translate-y-0.5 transition-all duration-300">
                            ✨ Mua Ngay
                        </div>
                    </a>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });

            // Reset animations
            categoryView.querySelectorAll('.fade-up').forEach(el => el.classList.remove('visible'));
            setTimeout(() => {
                categoryView.querySelectorAll('.fade-up').forEach(el => el.classList.add('visible'));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 50);
        }

        function showHomeView() {
            const homeView = document.getElementById('home-view');
            const categoryView = document.getElementById('category-view');
            
            categoryView.classList.add('hidden');
            homeView.classList.remove('hidden');
            
            homeView.querySelectorAll('.fade-up').forEach(el => el.classList.remove('visible'));
            setTimeout(() => {
                homeView.querySelectorAll('.fade-up').forEach(el => el.classList.add('visible'));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 50);
        }

        // Tạo hiệu ứng Hoa & Tuyết
        function createVisualEffects() {
            const container = document.getElementById('visual-effects');
            const panelWidth = container.offsetWidth;

            // Tạo Lá Sakura rơi
            for (let i = 0; i < 15; i++) {
                let petal = document.createElement('div');
                petal.classList.add('sakura-petal');
                let sizeW = Math.random() * 8 + 8; // Rộng 8-16px
                let sizeH = Math.random() * 4 + 6; // Cao 6-10px
                petal.style.width = `${sizeW}px`; 
                petal.style.height = `${sizeH}px`;
                petal.style.left = `${Math.random() * 100}vw`;
                
                let fallDuration = Math.random() * 10 + 8; // Rơi chậm 8-18s
                let swayDuration = Math.random() * 3 + 2; // Đung đưa 2-5s
                
                petal.style.animationDuration = `${fallDuration}s, ${swayDuration}s`;
                petal.style.animationDelay = `-${Math.random() * 10}s, -${Math.random() * 2}s`;
                container.appendChild(petal);
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            createVisualEffects();

            const fetch1 = async () => {
                if (GOOGLE_SHEET_TSV_URL !== "") {
                    try {
                        const noCacheUrl = GOOGLE_SHEET_TSV_URL + (GOOGLE_SHEET_TSV_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
                        const response = await fetch(noCacheUrl);
                        const tsvData = await response.text();
                        products = parseTSV(tsvData);
                    } catch(e) {
                        console.error("Lỗi tải data 1, dùng fallback", e);
                    }
                }
            };

            const fetch2 = async () => {
                if (GOOGLE_SHEET_GROUPS_TSV_URL !== "") {
                    try {
                        const noCacheUrl = GOOGLE_SHEET_GROUPS_TSV_URL + (GOOGLE_SHEET_GROUPS_TSV_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
                        const response = await fetch(noCacheUrl);
                        const tsvData = await response.text();
                        groupProducts = parseTSV(tsvData);
                    } catch(e) {
                        console.error("Lỗi tải data 2, dùng fallback", e);
                    }
                }
            };

            await Promise.all([fetch1(), fetch2()]);

            renderProducts(products);
            renderCategories(groupProducts);
        });
    </script>
</body>
</html>
